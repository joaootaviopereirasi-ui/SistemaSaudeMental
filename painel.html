<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pirâmide de Maslow</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="painel.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form class="card" id="loginForm">
    <img class="panel-login-logo" src="assets/piramide-maslow-logo.png" alt="Pirâmide de Maslow">
    <p class="muted">Acesso para RH, Saúde e Segurança do Trabalho e gestores.</p>
    <label class="f"><span>PIN de acesso</span><input id="pin" type="password" inputmode="numeric" autocomplete="off" required></label>
    <p id="loginErr" class="small" style="color:var(--vermelho)" role="alert"></p>
    <button class="btn primary" style="width:100%">Entrar</button>
    <a class="btn back-to-access" href="index.html">← Voltar à tela de login</a>
    <p class="small muted" style="margin-bottom:0">Acesso administrador: senha definida pelo responsável.</p>
  </form>
</div>

<div id="shell" hidden>
  <header class="bar">
    <div class="brand"><img class="panel-brand-logo" src="assets/piramide-maslow-logo.png" alt="Pirâmide de Maslow"></div>
    <nav id="nav" aria-label="Seções do painel"></nav>
    <span class="employee-wallet" id="employeeWallet" hidden aria-label="Saldo de moedas"></span>
    <button class="btn ghost" id="backLogin" type="button">← Voltar</button>
    <button class="btn ghost" id="logout">Sair</button>
  </header>
  <main>
    <section class="filters card" aria-label="Filtros">
      <label>Loja<select id="fStore"></select></label>
      <label>Setor<select id="fSector"></select></label>
      <label>Turno<select id="fShift"></select></label>
      <label>Período<select id="fDays">
        <option value="14">14 dias</option><option value="28" selected>28 dias</option><option value="56">56 dias</option><option value="90">90 dias</option>
      </select></label>
      <p class="small muted note" id="anon"></p>
    </section>
    <div id="view" aria-live="polite"></div>
  </main>
</div>

<dialog id="dlg"></dialog>
<script src="demo-api.js"></script>
<script src="painel.js"></script>
</body>
</html>
